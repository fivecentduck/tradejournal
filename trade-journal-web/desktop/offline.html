<!DOCTYPE html><html><head><meta charset="utf-8"><title>Trade Journal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;place-items:center;background:#0e131b;color:#e6e9ef;font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
.card{width:min(420px,90vw);background:#171d28;border:1px solid #262e3d;border-radius:14px;padding:28px;display:grid;gap:12px}
h1{margin:0;font-size:20px}p{margin:0;color:#8b94a7}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #262e3d;background:#0e131b;color:inherit;font:inherit}
input:focus{outline:2px solid #5aa7ff;outline-offset:1px}
button{padding:9px 14px;border-radius:8px;border:1px solid #262e3d;background:#171d28;color:inherit;font:inherit;font-weight:600;cursor:pointer}
button.primary{background:#5aa7ff;color:#08111d;border-color:transparent}
button:active{transform:scale(.97)}.err{color:#f0616d;min-height:20px;font-size:13px}
.row{display:flex;gap:8px}
</style></head><body>
<div class="card">
  <h1>Can't reach Trade Journal</h1>
  <p>Check your internet connection. Your journal is stored online, so the app needs a connection to open it.</p>
  <p id="h" style="font-size:12px"></p>
  <div class="row"><button class="primary" id="r">Try again</button><button id="c">Change server URL</button></div>
</div>
<script>
const h=new URLSearchParams(location.search).get('host');if(h)document.getElementById('h').textContent=h;
document.getElementById('r').onclick=()=>window.tj.retry();
document.getElementById('c').onclick=()=>{location.href='setup.html'};
</script></body></html>
